name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  github-release:
    name: GitHub Release
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BODY_FILE=release_notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" {grab=1; next}
              grab && $0 ~ /^## \[/ {exit}
              grab {print}
            ' CHANGELOG.md > "$BODY_FILE"
          fi
          if [ ! -s "$BODY_FILE" ]; then
            echo "See the full changelog for details." > "$BODY_FILE"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
